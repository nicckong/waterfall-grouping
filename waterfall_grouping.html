<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waterfall Grouping</title>
<script>
/* Independent check: if the main code below was damaged while the file was moved, say so instead of doing nothing. */
window.addEventListener('load', function () {
  if (window.__WG_APP__) return;
  var d = document.createElement('div');
  d.setAttribute('role', 'alert');
  d.style.cssText = 'margin:16px;padding:12px;border-radius:6px;background:#fbe9e9;color:#a12626;font:14px Arial,sans-serif';
  d.textContent = 'This copy of the tool is damaged and cannot run: part of the file was changed while it was being moved. ' +
    'Move the original file itself, e.g. as an email attachment or through a shared drive, rather than copying and pasting its text.';
  document.body.insertBefore(d, document.body.firstChild);
  var drop = document.getElementById('drop');
  if (drop) drop.hidden = true;
});
</script>
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f6f8; --panel: #ffffff; --ink: #1c2430; --muted: #5d6877; --line: #dde1e7; --head: #eef1f5; --head-2: #f6f7f9;
  --accent: #1f5fa8; --accent-ink: #ffffff; --others: #fff4d6; --others-ink: #6b4e00; --warn-bg: #fdf1e3; --warn-ink: #8a4b08; --ok: #1b7a4b; --err-bg: #fbe9e9; --err-ink: #a12626;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181e; --panel: #1c222a; --ink: #e7ebf0; --muted: #9aa5b3; --line: #313943; --head: #262d36; --head-2: #20262e;
    --accent: #6ea8e8; --accent-ink: #0d1520; --others: #40351a; --others-ink: #f4d58a; --warn-bg: #3b2c18; --warn-ink: #f0c58c; --ok: #5ccf96; --err-bg: #3d2020; --err-ink: #f2a9a9;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 Arial, Helvetica, sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
h1 { font-size: 17px; margin: 0; }
#fileName { color: var(--muted); overflow-wrap: anywhere; }
.spacer { flex: 1; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; border-radius: 6px; cursor: pointer; display: inline-block; }
button:hover:not(:disabled), .btn:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: bold; }
button:disabled { opacity: .55; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#drop { margin: 40px auto; width: min(620px, calc(100% - 32px)); background: var(--panel); border: 2px dashed var(--line); border-radius: 12px; padding: 44px 24px; text-align: center; }
#drop.over { border-color: var(--accent); }
#drop h2 { margin: 0 0 6px; font-size: 18px; }
#drop p { margin: 0 0 18px; color: var(--muted); }
#drop small { display: block; margin-top: 18px; color: var(--muted); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

.msg { margin: 12px 16px 0; padding: 9px 12px; border-radius: 6px; }
.msg.err { background: var(--err-bg); color: var(--err-ink); }
.msg.warn { background: var(--warn-bg); color: var(--warn-ink); }
.msg ul { margin: 4px 0 0; padding-left: 18px; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 12px; padding: 12px 16px 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 0; display: flex; flex-direction: column; }
.panel-head { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.panel-head h2 { font-size: 14px; margin: 0; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; }
#picker { overflow: auto; padding: 4px 12px 12px; flex: 1; }
.group { margin-top: 10px; }
.group-title { font-weight: bold; display: flex; justify-content: space-between; gap: 8px; }
.group-title span { font-weight: normal; color: var(--muted); font-size: 12px; }
.group label { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0 3px 4px; cursor: pointer; }
.group input { margin-top: 3px; accent-color: var(--accent); flex: none; }
.group-note { font-size: 12px; color: var(--warn-ink); margin: 2px 0 0 4px; }
.group.combine { padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.group-hint { font-size: 12px; color: var(--muted); margin: 0 0 2px 4px; }

#summary { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); }
#summary b { color: var(--ink); }
#check { font-weight: bold; color: var(--ok); }
#check.bad { color: var(--warn-ink); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }

#tableWrap { overflow: auto; flex: 1; min-height: 240px; }
table { border-collapse: separate; border-spacing: 0; font-size: 13px; }
th, td { padding: 0 8px; height: 26px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; background: var(--panel); }
thead th { position: sticky; z-index: 2; background: var(--head); font-weight: bold; }
thead tr:nth-child(1) th { top: 0; text-align: left; }
thead tr:nth-child(2) th { top: 26px; background: var(--head-2); }
thead tr:nth-child(3) th { top: 52px; background: var(--head-2); font-size: 12px; padding: 0; }
.sort-btn { font: inherit; font-weight: bold; color: inherit; background: none; border: 0; padding: 0 8px; height: 100%; width: 100%; cursor: pointer; white-space: nowrap; }
.sort-btn:hover { text-decoration: underline; }
.sort-btn .arrow { color: var(--accent); }
.lbl { position: sticky; left: 0; z-index: 1; text-align: left; min-width: 230px; border-right: 1px solid var(--line); }
thead .lbl { z-index: 3; }
.b-start { border-left: 2px solid var(--line); }
tr.root td, tr.parent td { font-weight: bold; }
tr.parent td { background: var(--head-2); }
tr.root td { background: var(--head); }
tr.child .lbl, tr.others .lbl { padding-left: 20px; }
tr.others td { background: var(--others); color: var(--others-ink); font-weight: bold; }
tbody td.neg { background: #f8b4b4; color: #1c2430; }
tbody td.pos { background: #a9ddb0; color: #1c2430; }

@media (max-width: 800px) {
  main { grid-template-columns: minmax(0, 1fr); }
  #picker { max-height: 320px; }
  .lbl { min-width: 150px; white-space: normal; }
  body { height: auto; }
  #tableWrap { max-height: 70vh; }
}
</style>
</head>
<body>
<header>
  <h1>Waterfall Grouping</h1>
  <span id="fileName"></span>
  <span class="spacer"></span>
  <label class="btn" id="changeBtn" hidden for="fileInput2">Choose another file</label>
  <button class="primary" id="exportBtn" hidden>Export to Excel</button>
</header>
<input class="visually-hidden" type="file" id="fileInput2" accept=".xlsx,.xlsm" tabindex="-1" aria-hidden="true">

<div id="messages"></div>

<section id="drop">
  <h2>Upload your Excel file</h2>
  <p>Drag it here, or choose it from your computer. Use an .xlsx file.</p>
  <label class="btn" for="fileInput" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:bold">Choose file</label>
  <input class="visually-hidden" type="file" id="fileInput" accept=".xlsx,.xlsm">
  <small>The file stays on this computer. Nothing is uploaded to a server.</small>
</section>

<main id="app" hidden>
  <section class="panel" aria-label="Rows to group">
    <div class="panel-head">
      <h2>Rows to group into Others</h2>
      <span class="spacer"></span>
      <button class="link" id="clearBtn">Clear all</button>
    </div>
    <div id="picker"></div>
  </section>
  <section class="panel" aria-label="Result">
    <div class="panel-head">
      <div class="tabs" role="tablist" id="tabs"></div>
      <span class="spacer"></span>
      <label>Show <select id="brandFilter"></select></label>
    </div>
    <div id="summary"></div>
    <div id="tableWrap"><table id="table"></table></div>
  </section>
</main>

<script>
/* Grouping logic. No DOM here: it takes ExcelJS worksheets, so it can be tested on its own. */
const GroupingCore = (() => {
  const clean = (x, d = 10) => { const p = 10 ** d; const v = Math.round(x * p) / p; return v === 0 ? 0 : v; };
  const text = (cell) => String(cell.text ?? '').trim();
  const num = (cell) => {
    const v = cell.value;
    if (typeof v === 'number') return v;
    // cell.value drops a formula result of exactly 0, so read cell.result.
    if (v && typeof v === 'object' && typeof cell.result === 'number') return cell.result;
    return null;
  };
  const isFormulaCell = (cell) => { const v = cell.value; return !!(v && typeof v === 'object' && (v.formula || v.sharedFormula)); };
  const formulaOf = (cell) => (isFormulaCell(cell) ? String(cell.formula || '') : '');

  const colName = (n) => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };
  const colNum = (s) => [...s.toUpperCase()].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0);

  function metricOf(t) {
    const s = t.toLowerCase().replace(/\s+/g, '');
    if (/rank/.test(s)) return 'rank';
    if (/^pro.*det/.test(s)) return 'net';
    if (/^pro/.test(s)) return 'pro';
    if (/^det/.test(s)) return 'det';
    return null;
  }

  /* Finds the Brand / Period / Metric header rows, the label column and the row hierarchy. */
  function detectLayout(ws) {
    const maxCol = ws.columnCount, maxRow = ws.rowCount;
    let metricRow = 0, metrics = {};
    for (let r = 1; r <= Math.min(20, maxRow); r++) {
      const m = {};
      for (let c = 1; c <= maxCol; c++) { const k = metricOf(text(ws.getCell(r, c))); if (k) m[c] = k; }
      const found = new Set(Object.values(m));
      if (['rank', 'pro', 'det', 'net'].every((k) => found.has(k))) { metricRow = r; metrics = m; break; }
    }
    if (metricRow < 3) return null;

    const brands = [];
    let brandName = '', periodName = '';
    const cols = Object.keys(metrics).map(Number).sort((a, b) => a - b);
    for (const c of cols) {
      brandName = text(ws.getCell(metricRow - 2, c)) || brandName;
      periodName = text(ws.getCell(metricRow - 1, c)) || periodName;
      if (!brandName || !periodName) return null;
      let b = brands.find((x) => x.name === brandName);
      if (!b) { b = { name: brandName, periods: [] }; brands.push(b); }
      let p = b.periods.find((x) => x.name === periodName);
      if (!p) { p = { name: periodName, isChg: /^(chg|change|diff|var)/i.test(periodName), cols: {} }; b.periods.push(p); }
      p.cols[metrics[c]] = c;
    }
    const complete = brands.every((b) => b.periods.every((p) => ['rank', 'pro', 'det', 'net'].every((k) => p.cols[k])));
    if (!complete || !cols[0] || cols[0] < 2) return null;
    const labelCol = cols[0] - 1;

    const rows = [];
    let started = false;
    for (let r = metricRow + 1; r <= maxRow; r++) {
      const label = text(ws.getCell(r, labelCol));
      const hasData = cols.some((c) => num(ws.getCell(r, c)) !== null || isFormulaCell(ws.getCell(r, c)));
      if (label && hasData) { rows.push({ row: r, label, level: 'other', parent: null }); started = true; }
      else if (!label && !hasData) continue; // blank spacer row: the table may carry on below it
      else if (started) break; // e.g. a footnote: the table has ended
    }
    if (!rows.length) return null;

    assignHierarchy(ws, rows, brands, labelCol);
    const uncalculated = rows.some((x) => cols.some((c) => isFormulaCell(ws.getCell(x.row, c)) && num(ws.getCell(x.row, c)) === null));
    return { metricRow, labelCol, brands, rows, cols, uncalculated };
  }

  /* The column left of the labels can state the hierarchy: A14:A20 = "Product" means row 14 is the parent
     and rows 15-20 its drivers. An unmerged A5 = "Overall" beside B5 = "Overall" is a total. Used only if
     every merge fits that pattern; otherwise the other methods decide. */
  function readFromMerges(ws, rows, byRow, labelCol) {
    if (labelCol < 2) return false;
    const col = labelCol - 1, plan = [];
    for (const x of rows) {
      const cell = ws.getCell(x.row, col);
      if (!cell.isMerged) {
        if (text(cell) && text(cell) === x.label) plan.push({ x, level: 'root' });
        continue;
      }
      const master = cell.master, parent = byRow.get(master.row);
      if (!parent || text(master) !== parent.label) return false;
      if (master.row === x.row) plan.push({ x, level: 'parent' });
      else plan.push({ x, level: 'child', parent });
    }
    if (!plan.some((p) => p.level === 'child')) return false;
    for (const { x, level, parent } of plan) {
      x.level = level;
      if (parent) { x.parent = parent.label; x.parentRow = parent.row; }
    }
    return true;
  }

  /* A parent's Pro and Det equal the sum of the rows under it, for every brand and period. Splits the
     whole table into parent + drivers blocks that all add up; if no such split exists, returns false.
     Exact sums are tried first, then a rounding allowance of 0.05 per row added. */
  function inferFromNumbers(ws, rows, brands) {
    const cols = brands.flatMap((b) => b.periods.filter((p) => !p.isChg).flatMap((p) => [p.cols.pro, p.cols.det]));
    const vec = rows.map((x) => cols.map((c) => num(ws.getCell(x.row, c)) ?? 0));
    const adds = (target, parts, perRow) => target.every((v, i) => Math.abs(parts.reduce((a, p) => a + p[i], 0) - v) <= perRow * (parts.length + 1) + 1e-6);

    const split = (from, perRow) => {
      const failed = new Set();
      const walk = (i) => {
        if (i === rows.length) return [];
        if (failed.has(i)) return null;
        for (let j = i + 1; j < rows.length; j++) {
          if (adds(vec[i], vec.slice(i + 1, j + 1), perRow)) {
            const rest = walk(j + 1);
            if (rest) return [{ parent: i, last: j }, ...rest];
          }
        }
        failed.add(i);
        return null;
      };
      return walk(from);
    };
    const apply = (blocks) => {
      for (const { parent, last } of blocks) {
        const p = rows[parent];
        p.level = 'parent';
        for (let k = parent + 1; k <= last; k++) Object.assign(rows[k], { level: 'child', parent: p.label, parentRow: p.row });
      }
      return true;
    };
    for (const perRow of [0, 0.05]) {
      // With a total on the first row (e.g. Overall), which equals the sum of the parents.
      const withTotal = rows.length > 2 ? split(1, perRow) : null;
      if (withTotal && adds(vec[0], withTotal.map((b) => vec[b.parent]), perRow)) { rows[0].level = 'root'; return apply(withTotal); }
      const noTotal = split(0, perRow);
      if (noTotal) return apply(noTotal);
    }
    return false;
  }

  function assignHierarchy(ws, rows, brands, labelCol) {
    const firstPeriod = brands[0].periods.find((p) => !p.isChg) || brands[0].periods[0];
    const proCol = firstPeriod.cols.pro;
    const byRow = new Map(rows.map((x) => [x.row, x]));
    if (readFromMerges(ws, rows, byRow, labelCol)) return;
    const adopt = (parent, rowNums) => {
      parent.level = 'parent';
      for (const n of rowNums) { const kid = byRow.get(n); if (kid && kid !== parent) { kid.level = 'child'; kid.parent = parent.label; kid.parentRow = parent.row; } }
    };
    // Parents are normally =SUM(D15:D20).
    for (const x of rows) {
      const m = formulaOf(ws.getCell(x.row, proCol)).match(/^\s*SUM\(\s*\$?([A-Z]+)\$?(\d+)\s*:\s*\$?\1\$?(\d+)\s*\)\s*$/i);
      if (m) { const nums = []; for (let n = +m[2]; n <= +m[3]; n++) nums.push(n); adopt(x, nums); }
    }
    // A =D6+D14+... row adds up other parents (a total), or adds up plain drivers (a parent).
    for (const x of rows) {
      if (x.level !== 'other') continue;
      const f = formulaOf(ws.getCell(x.row, proCol));
      if (!f) continue;
      const refs = [...f.matchAll(/\$?([A-Z]{1,3})\$?(\d+)/gi)].map((m) => +m[2]).filter((n) => byRow.has(n));
      if (!refs.length) continue;
      if (refs.every((n) => byRow.get(n).level === 'parent')) x.level = 'root';
      else adopt(x, refs);
    }
    // No formulas (e.g. a file written by a script): work it out from the numbers.
    if (!rows.some((x) => x.level === 'parent') && inferFromNumbers(ws, rows, brands)) return;
    // Numbers don't settle it: fall back on bold labels. Bold followed by bold is a total.
    if (!rows.some((x) => x.level === 'parent')) {
      const bold = (x) => !!ws.getCell(x.row, labelCol).font?.bold;
      let current = null;
      rows.forEach((x, i) => {
        if (bold(x)) {
          const next = rows[i + 1];
          if (next && !bold(next)) { x.level = 'parent'; current = x; } else { x.level = 'root'; current = null; }
        } else if (current) { x.level = 'child'; x.parent = current.label; x.parentRow = current.row; }
      });
    }
  }

  const keyOf = (parent, label) => parent + '\u0000' + label;

  /* sort = { brand, period, metric, dir: 'asc' | 'desc' }, matched by name so it works on every sheet. */
  function sortColumn(layout, sort) {
    if (!sort) return null;
    const b = layout.brands.find((x) => x.name === sort.brand);
    const p = b && b.periods.find((x) => x.name === sort.period);
    return (p && p.cols[sort.metric]) || null;
  }

  function buildPlan(ws, layout, selected, combine = new Set(), sort = null) {
    // Combined groups: one parent row ("Journey & Product") where the first of them was, with all their drivers under it.
    const comboParents = layout.rows.filter((x) => x.level === 'parent' && combine.has(x.label));
    const combo = comboParents.length >= 2
      ? { combo: true, label: comboParents.map((p) => p.label).join(' & '), parts: comboParents.map((p) => p.label), ticked: comboParents.map((p) => p.row) }
      : null;
    const inCombo = new Set(combo ? combo.ticked : []);
    const kidsOf = new Map();
    for (const x of layout.rows) {
      if (x.level !== 'child') continue;
      if (!kidsOf.has(x.parentRow)) kidsOf.set(x.parentRow, []);
      kidsOf.get(x.parentRow).push(x);
    }
    const moved = new Set(combo ? comboParents.flatMap((p) => (kidsOf.get(p.row) || []).map((k) => k.row)) : []);
    const parentLabelOf = (x) => (inCombo.has(x.parentRow) ? combo.label : x.parent);

    // Sorting: drivers are reordered within their group only; groups, Overall and other rows stay put.
    const sortCol = sortColumn(layout, sort);
    const sortKids = (kids) => {
      if (!sortCol) return kids;
      const key = (k) => { const v = num(ws.getCell(k.row, sortCol)); return v === null ? null : Math.round(v * 1e9); };
      return kids.map((k, i) => ({ k, i, v: key(k) })).sort((a, b) =>
        (a.v === null) - (b.v === null) || (a.v === null || a.v === b.v ? 0 : sort.dir === 'asc' ? a.v - b.v : b.v - a.v) || a.i - b.i,
      ).map((o) => o.k);
    };
    const info = new Map(layout.rows.map((x) => [x.row, x]));
    const seq = [], placed = new Set();
    for (let r = 1; r <= ws.rowCount; r++) {
      if (combo && r === combo.ticked[0]) {
        seq.push({ combo });
        for (const k of sortKids(comboParents.flatMap((p) => kidsOf.get(p.row) || []))) seq.push({ old: k.row });
      } else if (!inCombo.has(r) && !moved.has(r) && !placed.has(r)) {
        seq.push({ old: r });
        const x = info.get(r);
        if (sortCol && x && x.level === 'parent') {
          for (const k of sortKids(kidsOf.get(r) || [])) { seq.push({ old: k.row }); placed.add(k.row); }
        }
      }
    }

    // Ticked drivers collapse to one Others row after the last driver of their (possibly combined) group.
    const groups = new Map();
    seq.forEach((e, i) => {
      const x = e.old && info.get(e.old);
      if (!x || x.level !== 'child') return;
      const id = inCombo.has(x.parentRow) ? 'combo' : x.parentRow;
      if (!groups.has(id)) groups.set(id, { parent: parentLabelOf(x), ticked: [], lastIndex: i });
      const g = groups.get(id);
      g.lastIndex = i;
      if (selected.has(keyOf(x.parent, x.label))) g.ticked.push(x.row);
    });
    const active = [...groups.values()].filter((g) => g.ticked.length);
    const ticked = new Set(active.flatMap((g) => g.ticked));
    const lastAt = new Map(active.map((g) => [g.lastIndex, g]));

    const order = [], map = {};
    seq.forEach((e, i) => {
      if (e.combo) { order.push(e); combo.newRow = order.length; }
      else if (!ticked.has(e.old)) { order.push(e); map[e.old] = order.length; }
      const g = lastAt.get(i);
      if (g) { order.push({ group: g }); g.newRow = order.length; }
    });
    for (const g of active) { g.label = g.parent + ' - Others'; for (const r of g.ticked) map[r] = g.newRow; }
    if (combo) {
      for (const r of combo.ticked) map[r] = combo.newRow;
      combo.endRow = Math.max(combo.newRow, ...[...moved].map((r) => map[r]));
    }
    const removed = new Set([...ticked, ...inCombo]);
    const maxRow = ws.rowCount, delta = order.length - maxRow;
    return { order, map, active, combo, removed, maxRow, parentLabelOf, mapRow: (r) => map[r] ?? r + delta };
  }

  /* Pro and Det are summed; Pro-Det and chg follow from them; Rank is redone across brands. */
  function computeOthers(ws, layout, g) {
    const values = {}, formulas = {};
    const row = g.newRow;
    const addr = (c) => colName(c) + row;
    for (const b of layout.brands) {
      for (const p of b.periods) {
        if (p.isChg) continue;
        for (const m of ['pro', 'det']) {
          const c = p.cols[m];
          const parts = g.ticked.map((r) => num(ws.getCell(r, c))).filter((v) => v !== null);
          values[c] = clean(parts.reduce((a, v) => a + v, 0));
          if (parts.length > 1) formulas[c] = parts.map((v, i) => (i === 0 ? String(v) : (v < 0 ? '-' + -v : '+' + v))).join('');
        }
        values[p.cols.net] = clean(values[p.cols.pro] - values[p.cols.det]);
        // ROUND removes decimal noise (0.1+0.2 is not exactly 0.3), so equal scores tie in Rank.
        formulas[p.cols.net] = `ROUND(${addr(p.cols.pro)}-${addr(p.cols.det)},10)`;
      }
    }
    for (const b of layout.brands) {
      for (const p of b.periods) {
        if (p.isChg) continue;
        const me = p.cols.net;
        const rivals = layout.brands.filter((o) => o !== b).map((o) => o.periods.find((q) => q.name === p.name)).filter(Boolean).map((q) => q.cols.net);
        values[p.cols.rank] = 1 + rivals.filter((c) => values[c] > values[me]).length;
        formulas[p.cols.rank] = ['1', ...rivals.map((c) => `(${addr(c)}>${addr(me)})`)].join('+');
      }
      const base = b.periods.filter((p) => !p.isChg);
      const chg = b.periods.find((p) => p.isChg);
      if (chg && base.length >= 2) {
        const first = base[0], last = base[base.length - 1];
        for (const m of ['rank', 'pro', 'det', 'net']) {
          // Rank chg is first minus last, so a positive number means the brand moved up.
          const [a, z] = m === 'rank' ? [first, last] : [last, first];
          values[chg.cols[m]] = clean(values[a.cols[m]] - values[z.cols[m]]);
          formulas[chg.cols[m]] = addr(a.cols[m]) + '-' + addr(z.cols[m]);
        }
      }
    }
    return { values, formulas };
  }

  /* The result table for the screen: read-only, the worksheet is not changed. */
  function preview(ws, layout, selected, combine, sort) {
    const plan = buildPlan(ws, layout, selected, combine, sort);
    const info = new Map(layout.rows.map((x) => [x.row, x]));
    const rows = [];
    for (const e of plan.order) {
      if (e.group) {
        rows.push({ kind: 'others', label: e.group.label, values: computeOthers(ws, layout, e.group).values, parent: e.group.parent });
      } else if (e.combo) {
        rows.push({ kind: 'parent', label: e.combo.label, values: computeOthers(ws, layout, e.combo).values, combined: true });
      } else if (info.has(e.old)) {
        const x = info.get(e.old), values = {};
        for (const c of layout.cols) values[c] = num(ws.getCell(e.old, c));
        rows.push({ kind: x.level, label: x.label, values, parent: x.level === 'child' ? plan.parentLabelOf(x) : x.parent, row: e.old });
      }
    }
    return { rows, plan };
  }

  /* After grouping, the drivers should still add up to their parent row. */
  function reconcile(layout, rows) {
    const issues = [];
    const parents = rows.filter((x) => x.kind === 'parent');
    for (const par of parents) {
      const kids = rows.filter((x) => (x.kind === 'child' || x.kind === 'others') && x.parent === par.label);
      for (const b of layout.brands) for (const p of b.periods) {
        if (p.isChg) continue;
        for (const m of ['pro', 'det']) {
          const c = p.cols[m];
          if (par.values[c] === null) continue;
          const total = kids.reduce((a, k) => a + (k.values[c] || 0), 0);
          if (Math.abs(total - par.values[c]) > 1e-6) issues.push({ parent: par.label, brand: b.name, period: p.name, metric: m, total: clean(total), expected: par.values[c] });
        }
      }
    }
    return issues;
  }

  /* Rewrites row numbers in a formula. A range keeps covering the same rows, including the new one. */
  function remapFormula(formula, sheetName, plans, onSingleRef) {
    const re = /((?:'[^']+'|[A-Za-z0-9_.]+)!)?(?<![A-Za-z0-9_.$])(\$?[A-Z]{1,3})(\$?)(\d+)(?::(\$?[A-Z]{1,3})(\$?)(\d+))?(?![A-Za-z0-9_(])/g;
    return formula.split(/("[^"]*")/).map((part, i) => (i % 2 ? part : part.replace(re, (all, sheet, c1, abs1, r1, c2, abs2, r2) => {
      const target = sheet ? sheet.slice(0, -1).replace(/^'|'$/g, '') : sheetName;
      const plan = plans.get(target);
      if (!plan) return all;
      if (r2 === undefined) {
        if (plan.removed.has(+r1)) onSingleRef?.(all);
        return `${sheet || ''}${c1}${abs1}${plan.mapRow(+r1)}`;
      }
      const [a, z] = mapSpan(plan, +r1, +r2);
      return `${sheet || ''}${c1}${abs1}${a}:${c2}${abs2}${z}`;
    }))).join('');
  }

  function mapSpan(plan, r1, r2) {
    let a = Infinity, z = -Infinity;
    for (let r = r1; r <= r2; r++) { const n = plan.mapRow(r); if (n < a) a = n; if (n > z) z = n; }
    return [a, z];
  }

  function mapRef(ref, plan) {
    return ref.split(/\s+/).filter(Boolean).map((one) => {
      const m = one.match(/^(\$?[A-Z]{1,3}\$?)(\d+)(?::(\$?[A-Z]{1,3}\$?)(\d+))?$/);
      if (!m) return one;
      if (m[4] === undefined) return m[1] + plan.mapRow(+m[2]);
      const [a, z] = mapSpan(plan, +m[2], +m[4]);
      return `${m[1]}${a}:${m[3]}${z}`;
    }).join(' ');
  }

  const RED = 'FFF8B4B4', GREEN = 'FFA9DDB0';
  const flatFill = (argb) => ({ fill: { type: 'pattern', pattern: 'solid', bgColor: { argb } } });
  const columnsOf = (ref) => ref.split(/\s+/).filter(Boolean).flatMap((one) => {
    const m = one.match(/^\$?([A-Z]{1,3})\$?\d+(?::\$?([A-Z]{1,3})\$?\d+)?$/);
    if (!m) return [0];
    const out = [];
    for (let c = colNum(m[1]); c <= colNum(m[2] || m[1]); c++) out.push(c);
    return out;
  });

  /* chg columns: flat red for a worse move, flat green for a better one, no fill at zero. Replaces any gradient there.
     Det NPS is reversed, because fewer detractors is an improvement. */
  function applyChgColours(ws, layout, plan) {
    const chgCols = layout.brands.flatMap((b) => b.periods.filter((p) => p.isChg).flatMap((p) => Object.values(p.cols)));
    if (!chgCols.length) return;
    const isChg = new Set(chgCols);
    const kept = (ws.conditionalFormattings || []).map((cf) => {
      const onChgOnly = columnsOf(cf.ref).every((c) => isChg.has(c));
      // Drop gradients, and this tool's own red/green rules from an earlier export, so they don't pile up.
      const ours = (r) => r.type === 'expression' && (r.formulae || []).every((f) => /^ROUND\(\$?[A-Z]{1,3}\$?\d+,6\)[<>]0$/.test(String(f)));
      return onChgOnly ? { ...cf, rules: cf.rules.filter((r) => r.type !== 'colorScale' && !ours(r)) } : cf;
    }).filter((cf) => cf.rules.length);
    let priority = kept.flatMap((cf) => cf.rules).reduce((a, r) => Math.max(a, r.priority || 0), 0);
    const newRows = layout.rows.map((x) => plan.mapRow(x.row));
    const first = Math.min(...newRows), last = Math.max(...newRows);
    const detCols = new Set(layout.brands.flatMap((b) => b.periods.filter((p) => p.isChg).map((p) => p.cols.det)));
    for (const c of [...chgCols].sort((a, b) => a - b)) {
      const cell = colName(c) + first;
      const [below, above] = detCols.has(c) ? [GREEN, RED] : [RED, GREEN];
      // ROUND stops decimal noise from colouring a zero.
      kept.push({ ref: `${colName(c)}${first}:${colName(c)}${last}`, rules: [
        { type: 'expression', priority: ++priority, formulae: [`ROUND(${cell},6)<0`], style: flatFill(below) },
        { type: 'expression', priority: ++priority, formulae: [`ROUND(${cell},6)>0`], style: flatFill(above) },
      ] });
    }
    ws.conditionalFormattings = kept;
  }

  /* Applies the grouping to a loaded workbook, in place. Returns any warnings. */
  function applyToWorkbook(wb, selected, combine = new Set(), sort = null) {
    const warnings = [];
    const layouts = new Map(), plans = new Map();
    wb.eachSheet((ws) => {
      const layout = detectLayout(ws);
      if (layout) { layouts.set(ws.name, layout); plans.set(ws.name, buildPlan(ws, layout, selected, combine, sort)); }
    });
    wb.eachSheet((ws) => {
      const plan = plans.get(ws.name);
      if (!plan) return;
      const layout = layouts.get(ws.name);
      const others = new Map([...plan.active, ...(plan.combo ? [plan.combo] : [])].map((g) => [g, computeOthers(ws, layout, g)]));
      const onSingleRef = (ref) => warnings.push(`${ws.name}: a formula refers directly to grouped cell ${ref}. Check this formula in the export.`);
      const isKept = (r) => !plan.removed.has(r);
      const isRefSum = (f) => f.split('+').length > 1 && f.split('+').every((t) => /^\s*\$?[A-Z]{1,3}\$?\d+\s*$/.test(t));
      const remap = (f) => {
        const hits = [];
        const out = remapFormula(f, ws.name, plans, (ref) => hits.push(ref));
        // =D6+D14+D21+D27 where D6 and D14 are now one combined row: count that row once.
        if (isRefSum(f) && isRefSum(out)) {
          const refs = out.split('+').map((t) => t.trim());
          if (new Set(refs).size < refs.length && new Set(f.split('+').map((t) => t.trim())).size === refs.length) return [...new Set(refs)].join('+');
        }
        hits.forEach(onSingleRef);
        return out;
      };

      const maxCol = ws.columnCount;
      const merges = (ws.model.merges || []).slice();
      merges.forEach((m) => ws.unMergeCells(m));

      const snap = new Map();
      for (let r = 1; r <= plan.maxRow; r++) {
        const row = ws.getRow(r), cells = [];
        for (let c = 1; c <= maxCol; c++) {
          const cell = ws.getCell(r, c);
          cells[c] = { value: cell.value, formula: formulaOf(cell), result: cell.result, style: cell.style };
        }
        snap.set(r, { height: row.height, hidden: row.hidden, outlineLevel: row.outlineLevel, cells });
      }

      const total = Math.max(plan.order.length, plan.maxRow);
      for (let i = 1; i <= total; i++) {
        const e = plan.order[i - 1];
        const row = ws.getRow(i);
        const made = e && (e.group || e.combo);
        const src = e ? snap.get(made ? made.ticked[0] : e.old) : null;
        row.height = src ? src.height : undefined;
        row.hidden = src ? src.hidden : false;
        row.outlineLevel = src ? src.outlineLevel : 0;
        for (let c = 1; c <= maxCol; c++) {
          const cell = ws.getCell(i, c);
          if (!src) { cell.value = null; cell.style = {}; continue; }
          const s = src.cells[c];
          cell.style = s.style;
          if (made) {
            const o = others.get(made);
            if (c === layout.labelCol) cell.value = made.label;
            // Column A beside a combined row: it held the first group's name, so it gets the combined name.
            else if (o.values[c] === undefined) cell.value = e.combo && typeof s.value === 'string' && s.value.trim() === made.parts[0] ? made.label : null;
            else if (o.formulas[c]) cell.value = { formula: o.formulas[c], result: o.values[c] };
            else cell.value = o.values[c];
          } else if (s.formula && isKept(e.old)) {
            cell.value = { formula: remap(s.formula), result: s.result };
          } else {
            cell.value = s.value;
          }
        }
      }

      const comboCols = new Set();
      merges.forEach((m) => {
        const [, col1, top] = m.match(/^([A-Z]+)(\d+)/) || [];
        if (plan.combo && plan.combo.ticked.includes(+top)) { comboCols.add(col1); return; } // replaced by one merge below
        const mapped = mapRef(m, plan);
        const [, r1, r2] = m.match(/[A-Z]+(\d+):[A-Z]+(\d+)/) || [];
        if (r1 && plan.removed.has(+r1) && plan.removed.has(+r2)) return;
        try { ws.mergeCells(mapped); } catch (err) { warnings.push(`${ws.name}: could not restore merged cells ${m}.`); }
      });
      for (const col of comboCols) {
        const ref = `${col}${plan.combo.newRow}:${col}${plan.combo.endRow}`;
        try { if (plan.combo.endRow > plan.combo.newRow) ws.mergeCells(ref); } catch (err) { warnings.push(`${ws.name}: could not merge ${ref}.`); }
      }

      for (const cf of ws.conditionalFormattings || []) {
        cf.ref = mapRef(cf.ref, plan);
        for (const rule of cf.rules || []) {
          if (Array.isArray(rule.formulae)) rule.formulae = rule.formulae.map((f) => (typeof f === 'string' ? remap(f) : f));
        }
      }
      applyChgColours(ws, layout, plan);
    });
    wb.calcProperties = { ...(wb.calcProperties || {}), fullCalcOnLoad: true };
    return warnings;
  }

  return { detectLayout, preview, reconcile, applyToWorkbook, keyOf, colName, colNum };
})();
if (typeof module !== 'undefined') module.exports = GroupingCore;

</script>
<script>
const $ = (id) => document.getElementById(id);
const state = { buffer: null, wb: null, fileName: '', sheets: [], selected: new Set(), active: null, brand: 'all' };

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v; else if (k in n) n[k] = v; else n.setAttribute(k, v);
  }
  n.append(...kids);
  return n;
}

function showMessages(errors = [], warnings = []) {
  const box = $('messages');
  box.replaceChildren();
  for (const e of errors) box.append(el('div', { class: 'msg err', role: 'alert' }, e));
  if (warnings.length) {
    const ul = el('ul');
    warnings.forEach((w) => ul.append(el('li', {}, w)));
    box.append(el('div', { class: 'msg warn' }, 'Please check:', ul));
  }
}

/* The built-in Excel reader (ExcelJS) is stored compressed, in numbered parts at the end of this file.
   It is unpacked when the page opens. If a part was lost or changed while the file was copied,
   the page says which one instead of failing on every upload. */
const ORIGINAL_SIZE = /*SIZE*/ 397397, LIBRARY_PARTS = 4;
let libraryError = null;

function crc32(text) {
  let c, crc = 0xffffffff;
  for (let i = 0; i < text.length; i++) {
    c = (crc ^ text.charCodeAt(i)) & 0xff;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    crc = (crc >>> 8) ^ c;
  }
  return ((crc ^ 0xffffffff) >>> 0).toString(16).padStart(8, '0');
}

const libraryReady = (async () => {
  if (document.readyState === 'loading') await new Promise((r) => document.addEventListener('DOMContentLoaded', r));
  const kb = (n) => Math.round(n / 1024).toLocaleString() + ' KB';
  const sizes = ` (This copy is about ${kb(document.documentElement.outerHTML.length)}; the original is about ${kb(ORIGINAL_SIZE)}.)`;
  const advice = ' Copy the whole file again. If pasting keeps cutting it short, move the file itself instead, e.g. as an email attachment or through a shared drive.';
  const parts = new Map([...document.querySelectorAll('script[type="text/x-wg-part"]')].map((el) => [Number(el.dataset.part), el]));
  const broken = [];
  for (let i = 1; i <= LIBRARY_PARTS; i++) {
    const el = parts.get(i);
    if (!el) broken.push(`part ${i} of ${LIBRARY_PARTS} is missing`);
    else if (crc32(el.textContent.replace(/\s+/g, '')) !== el.dataset.crc) broken.push(`part ${i} of ${LIBRARY_PARTS} was changed`);
  }
  if (broken.length) {
    const cutShort = !parts.has(LIBRARY_PARTS); // the last part is gone: the paste stopped early
    throw new Error((cutShort ? 'This copy of the tool is incomplete: the end of the file is missing, so it cannot read Excel files. '
      : 'This copy of the tool cannot read Excel files because its built-in Excel reader is damaged. ') +
      `In the Excel reader at the bottom of the file, ${broken.join(', ')}.` + sizes + advice);
  }
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('This browser is too old to run the tool. Open the file in a current version of Chrome or Edge.');
  }
  const b64 = [...parts.keys()].sort((a, b) => a - b).map((i) => parts.get(i).textContent.replace(/\s+/g, '')).join('');
  const bytes = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
  const code = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const script = document.createElement('script');
  script.textContent = code;
  document.head.append(script);
  if (typeof ExcelJS === 'undefined' || !ExcelJS.Workbook) {
    throw new Error('This copy of the tool could not start its built-in Excel reader. Open the file directly in Chrome or Edge.' + sizes);
  }
})().catch((err) => {
  libraryError = err.message;
  showMessages([libraryError]);
  $('drop').hidden = true;
});

async function loadFile(file) {
  showMessages();
  if (!file) return;
  await libraryReady;
  if (libraryError) { showMessages([libraryError]); return; }
  if (!/\.(xlsx|xlsm)$/i.test(file.name)) {
    showMessages([`"${file.name}" is not an .xlsx file. If it is an older .xls file, save it as .xlsx in Excel first.`]);
    return;
  }
  try {
    const buffer = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buffer.slice(0));
    const sheets = [], skipped = [];
    wb.eachSheet((ws) => {
      const layout = GroupingCore.detectLayout(ws);
      if (layout) sheets.push({ ws, layout }); else skipped.push(ws.name);
    });
    if (!sheets.length) {
      showMessages(['No table found. The tool looks for a header row with Rank, Pro NPS, Det NPS and Pro-Det NPS, with the brand and period in the two rows above it.']);
      return;
    }
    const warnings = [];
    if (skipped.length) warnings.push(`No table found on: ${skipped.join(', ')}. These sheets are exported unchanged.`);
    const stale = sheets.filter((s) => s.layout.uncalculated).map((s) => s.ws.name);
    if (stale.length) {
      showMessages([`Some formulas on ${stale.join(', ')} have no calculated values. Open the file in Excel, save it, and upload it again.`], warnings);
      return;
    }
    if (!sheets.some((s) => s.layout.rows.some((r) => r.level === 'child'))) {
      showMessages(["The table was found, but not which rows belong to which parent. Each parent row's Pro NPS and Det NPS should equal the sum of the rows under it. Otherwise, merge each group in the column left of the labels, make the parent labels bold, or use =SUM(...) in them."], warnings);
      return;
    }
    Object.assign(state, { buffer, wb, fileName: file.name, sheets, selected: new Set(), combine: new Set(), sort: null, active: sheets[0].ws.name, brand: 'all', baseWarnings: warnings });
    $('drop').hidden = true;
    $('app').hidden = false;
    $('changeBtn').hidden = false;
    $('exportBtn').hidden = false;
    $('fileName').textContent = file.name;
    renderTabs(); renderBrandFilter(); renderPicker(); renderResult();
  } catch (err) {
    console.error(err);
    showMessages([`Could not read "${file.name}". It may be damaged or password protected. (${err.message})`]);
  }
}

/* Groups as they appear in the table: parent label -> driver labels, across all sheets. */
function tableGroups() {
  const groups = new Map();
  for (const { layout } of state.sheets) {
    for (const r of layout.rows) {
      if (r.level !== 'child') continue;
      if (!groups.has(r.parent)) groups.set(r.parent, []);
      const list = groups.get(r.parent);
      if (!list.includes(r.label)) list.push(r.label);
    }
  }
  return groups;
}

/* Groups for the picker, with combined groups shown as one. Keys stay per original group. */
function pickerGroups() {
  const groups = tableGroups();
  const parts = [...groups.keys()].filter((p) => state.combine.has(p));
  const out = [];
  for (const [parent, labels] of groups) {
    const items = labels.map((label) => ({ label, key: GroupingCore.keyOf(parent, label) }));
    if (parts.length >= 2 && parts.includes(parent)) {
      if (parent === parts[0]) out.push({ title: parts.join(' & '), items: parts.flatMap((p) => groups.get(p).map((label) => ({ label, key: GroupingCore.keyOf(p, label) }))) });
    } else out.push({ title: parent, items });
  }
  return out;
}

function renderPicker() {
  const box = $('picker');
  box.replaceChildren();

  const combine = el('div', { class: 'group combine' });
  combine.append(el('div', { class: 'group-title' }, 'Combine groups'), el('div', { class: 'group-hint' }, 'Tick two or more to merge them into one group.'));
  for (const parent of tableGroups().keys()) {
    const input = el('input', { type: 'checkbox', checked: state.combine.has(parent) });
    input.addEventListener('change', () => {
      if (input.checked) state.combine.add(parent); else state.combine.delete(parent);
      renderPicker(); renderResult();
    });
    combine.append(el('label', {}, input, parent));
  }
  if (state.combine.size === 1) combine.append(el('div', { class: 'group-note' }, 'Tick at least one more group to combine.'));
  box.append(combine);

  for (const { title, items } of pickerGroups()) {
    const ticked = items.filter((i) => state.selected.has(i.key)).length;
    const g = el('div', { class: 'group' });
    g.append(el('div', { class: 'group-title' }, title, el('span', {}, ticked ? `${ticked} of ${items.length}` : '')));
    for (const { label, key } of items) {
      const input = el('input', { type: 'checkbox', checked: state.selected.has(key) });
      input.addEventListener('change', () => {
        if (input.checked) state.selected.add(key); else state.selected.delete(key);
        renderPicker(); renderResult();
      });
      g.append(el('label', {}, input, label));
    }
    if (ticked === 1) g.append(el('div', { class: 'group-note' }, 'Only one row ticked: this just renames it to Others.'));
    if (ticked === items.length) g.append(el('div', { class: 'group-note' }, `All rows ticked: Others will equal ${title}.`));
    box.append(g);
  }
}

function renderTabs() {
  const box = $('tabs');
  box.replaceChildren();
  for (const { ws } of state.sheets) {
    const b = el('button', { type: 'button', role: 'tab' }, ws.name);
    b.setAttribute('aria-selected', String(ws.name === state.active));
    b.addEventListener('click', () => { state.active = ws.name; renderTabs(); renderBrandFilter(); renderResult(); });
    box.append(b);
  }
}

function currentSheet() { return state.sheets.find((s) => s.ws.name === state.active); }

function renderBrandFilter() {
  const sel = $('brandFilter');
  sel.replaceChildren(el('option', { value: 'all' }, 'All brands'));
  for (const b of currentSheet().layout.brands) sel.append(el('option', { value: b.name }, b.name));
  if (![...sel.options].some((o) => o.value === state.brand)) state.brand = 'all';
  sel.value = state.brand;
}

function fmt(v, metric) {
  if (v === null || v === undefined) return '';
  if (metric === 'rank') return String(Math.round(v));
  const s = v.toFixed(1);
  return s === '-0.0' ? '0.0' : s;
}

const METRIC_NAMES = { rank: 'Rank', pro: 'Pro NPS', det: 'Det NPS', net: 'Pro-Det NPS' };

function renderResult() {
  const { ws, layout } = currentSheet();
  const { rows, plan } = GroupingCore.preview(ws, layout, state.selected, state.combine, state.sort);

  const summary = $('summary');
  summary.replaceChildren();
  const srt = state.sort;
  const sortNote = srt ? `Sorted within each group by ${srt.brand} / ${srt.period} / ${METRIC_NAMES[srt.metric]}, ${srt.dir === 'asc' ? 'lowest' : 'highest'} first. The export uses this order. Click the column again to reverse it, or a third time to undo.` : '';
  if (!plan.active.length && !plan.combo) {
    summary.append('Tick rows on the left to group them, or click a column heading to sort. The table below updates as you go.');
    if (sortNote) summary.append(el('br'), sortNote);
  } else {
    if (sortNote) summary.append(sortNote, el('br'));
    if (plan.combo) summary.append(el('b', {}, plan.combo.label), ` = ${plan.combo.parts.join(' + ')}`);
    plan.active.forEach((g, i) => {
      if (i || plan.combo) summary.append(el('br'));
      const names = g.ticked.map((r) => layout.rows.find((x) => x.row === r).label).join(' + ');
      summary.append(el('b', {}, g.label), ` = ${names}`);
    });
    const allIssues = state.sheets.flatMap((s) => GroupingCore.reconcile(s.layout, GroupingCore.preview(s.ws, s.layout, state.selected, state.combine, state.sort).rows).map((x) => ({ ...x, sheet: s.ws.name })));
    summary.append(el('br'));
    if (allIssues.length) {
      const first = allIssues[0];
      summary.append(el('span', { id: 'check', class: 'bad' }, `Drivers don't add up to the parent in ${allIssues.length} place(s), e.g. ${first.sheet} / ${first.brand} / ${first.period} / ${first.parent}: ${first.total} vs ${first.expected}.`));
    } else {
      summary.append(el('span', { id: 'check' }, 'Checked: drivers still add up to their parent row on every sheet.'));
    }
  }
  showMessages([], state.baseWarnings);

  const brands = layout.brands.filter((b) => state.brand === 'all' || b.name === state.brand);
  const table = $('table');
  const r1 = el('tr'), r2 = el('tr'), r3 = el('tr');
  const corner = () => el('th', { class: 'lbl' });
  r1.append(corner()); r2.append(corner()); r3.append(corner());
  const columns = [];
  for (const b of brands) {
    const count = b.periods.reduce((a, p) => a + Object.keys(p.cols).length, 0);
    r1.append(el('th', { colSpan: count, class: 'b-start' }, b.name));
    b.periods.forEach((p, pi) => {
      const metrics = Object.keys(p.cols).sort((x, y) => p.cols[x] - p.cols[y]);
      r2.append(el('th', { colSpan: metrics.length, class: pi === 0 ? 'b-start' : '' }, p.name));
      metrics.forEach((m, mi) => {
        const start = pi === 0 && mi === 0;
        // Click: best first (rank 1, or the highest value), then the reverse, then back to the original order.
        // Rank chg counts places moved up, so for it higher is better too.
        const on = state.sort && state.sort.brand === b.name && state.sort.period === p.name && state.sort.metric === m;
        const first = m === 'rank' && !p.isChg ? 'asc' : 'desc';
        const btn = el('button', { type: 'button', class: 'sort-btn', title: 'Sort drivers within each group' }, METRIC_NAMES[m],
          on ? el('span', { class: 'arrow' }, state.sort.dir === 'asc' ? ' \u25B2' : ' \u25BC') : '');
        btn.addEventListener('click', () => {
          if (!on) state.sort = { brand: b.name, period: p.name, metric: m, dir: first };
          else if (state.sort.dir === first) state.sort = { ...state.sort, dir: first === 'asc' ? 'desc' : 'asc' };
          else state.sort = null;
          renderResult();
        });
        const th = el('th', { class: start ? 'b-start' : '' }, btn);
        if (on) th.setAttribute('aria-sort', state.sort.dir === 'asc' ? 'ascending' : 'descending');
        r3.append(th);
        columns.push({ col: p.cols[m], metric: m, start, isChg: p.isChg });
      });
    });
  }
  const tbody = el('tbody');
  for (const row of rows) {
    const tr = el('tr', { class: row.kind });
    tr.append(el('td', { class: 'lbl' }, row.label));
    for (const c of columns) {
      const v = row.values[c.col];
      const sign = c.isChg && typeof v === 'number' ? Math.sign(Math.round(v * 1e6)) : 0;
      // Red is a worse move, green a better one. For Det NPS, a fall is the better move.
      const good = c.metric === 'det' ? -sign : sign;
      const cls = [c.start ? 'b-start' : '', good < 0 ? 'neg' : good > 0 ? 'pos' : ''].filter(Boolean).join(' ');
      tr.append(el('td', { class: cls }, fmt(v, c.metric)));
    }
    tbody.append(tr);
  }
  table.replaceChildren(el('thead', {}, r1, r2, r3), tbody);
}

async function exportFile() {
  const btn = $('exportBtn');
  btn.disabled = true;
  btn.textContent = 'Exporting...';
  try {
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(state.buffer.slice(0));
    const warnings = GroupingCore.applyToWorkbook(wb, state.selected, state.combine, state.sort);
    const out = await wb.xlsx.writeBuffer();
    const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = el('a', { href: URL.createObjectURL(blob), download: state.fileName.replace(/\.[^.]+$/, '') + '_grouped.xlsx' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    showMessages([], [...state.baseWarnings, ...warnings]);
  } catch (err) {
    console.error(err);
    showMessages([`Export failed: ${err.message}`], state.baseWarnings);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Export to Excel';
  }
}

for (const id of ['fileInput', 'fileInput2']) {
  $(id).addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });
}
$('exportBtn').addEventListener('click', exportFile);
$('clearBtn').addEventListener('click', () => { state.selected.clear(); state.combine.clear(); renderPicker(); renderResult(); });
$('brandFilter').addEventListener('change', (e) => { state.brand = e.target.value; renderResult(); });
['dragover', 'dragenter'].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); $('drop').classList.remove('over'); }));
document.addEventListener('drop', (e) => loadFile(e.dataTransfer.files[0]));
window.__WG_APP__ = true;
</script>
